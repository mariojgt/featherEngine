# Build and publish Windows, macOS and Linux desktop installers on a new version tag.
#
# Trigger: push a tag matching v* (e.g. `git tag v0.2.1 && git push origin v0.2.1`).
# See docs/RELEASING.md for the full checklist — including the mandatory website
# download-link update that follows every tag.
#
# Tauri cannot cross-compile, so a matrix builds each OS on its own runner.
# tauri-action runs the build (frontend via beforeBuildCommand, then cargo),
# creates a draft GitHub Release for the tag and attaches the installers:
#   - Windows: NSIS installer (.exe) + MSI
#   - macOS:   .dmg (+ .app) for both Apple Silicon and Intel
#   - Linux:   .AppImage, .deb and .rpm
#
# The release stays a draft until every matrix leg succeeds; the `publish` job
# then attaches latest.json and flips it live, so downloaders never see a
# release that is missing half its platforms.
name: Release Desktop Installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # tauri-action names the release from tauri.conf.json (`v__VERSION__`), not from
  # the pushed tag. If the two disagree it silently builds a release for a tag
  # nobody pushed, so fail in seconds rather than 15 minutes into four builds.
  verify-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json and tauri.conf.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          pkg=$(jq -r .version package.json)
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          echo "tag=$expected package.json=$pkg tauri.conf.json=$conf"
          if [ "$pkg" != "$expected" ] || [ "$conf" != "$expected" ]; then
            echo "::error::Tag $TAG does not match package.json ($pkg) / tauri.conf.json ($conf). See docs/RELEASING.md."
            exit 1
          fi

  release:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust_targets: ""
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - platform: macos-latest # Apple Silicon (M1+). Runner itself is arm64.
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin"
          - platform: macos-latest # Intel Macs (x64 runtime on the arm64 runner).
            args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1.34'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      # The full Tauri v2 Linux prerequisite set. The shorter list that compiles
      # `cargo check` is not enough to *bundle* an AppImage.
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file patchelf

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEATHER_RUNNER_TARGET: ${{ matrix.rust_targets }}
        with:
          tagName: v__VERSION__
          releaseName: "Feather Engine v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Publish optional platform runner pack
        uses: actions/upload-artifact@v4
        with:
          name: runner-${{ matrix.platform }}-${{ matrix.rust_targets || 'host' }}
          path: src-tauri/export-runtime/runners/*/
          if-no-files-found: error

  # Attach a machine-readable manifest, then take the release out of draft.
  # `latest.json` is the stable contract for anything that needs to resolve the
  # current build — the website's `npm run sync:release`, docs, in-app checks:
  #   https://github.com/mariojgt/featherEngine/releases/latest/download/latest.json
  publish:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - name: Build latest.json manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Draft assets carry an `untagged-…` download URL, so rewrite every
          # entry to the permanent /releases/download/<tag>/<name> form that
          # becomes valid the moment the release is published below.
          gh api "repos/$REPO/releases/tags/$TAG" > release.json \
            || gh release view "$TAG" --repo "$REPO" --json tagName,name,publishedAt,body,assets > release.json
          jq --arg tag "$TAG" --arg repo "$REPO" '{
            tag: $tag,
            version: ($tag | ltrimstr("v")),
            publishedAt: (.published_at // .publishedAt // null),
            releaseUrl: "https://github.com/\($repo)/releases/tag/\($tag)",
            assets: [
              .assets[]
              | select(.name != "latest.json")
              | {
                  name: .name,
                  size: .size,
                  url: "https://github.com/\($repo)/releases/download/\($tag)/\(.name)"
                }
            ] | sort_by(.name)
          }' release.json > latest.json
          cat latest.json

      - name: Attach manifest and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          echo "Published https://github.com/$REPO/releases/tag/$TAG"
